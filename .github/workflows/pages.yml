name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/data.js
          node --check assets/paraphrase.js
          node --check assets/media.js
          node --check assets/srs.js
          node --check assets/cards.js
          node --check assets/shadow.js
          node --check assets/import.js
          node --check assets/inbox.js
          node --check assets/speech.js
          node --check assets/update.js
          node --check assets/sync.js
          node --check sw.js
          # assets/vendor/ は外から持ってきたものなので見ない（手を入れない約束）

      - name: Check the build number matches everywhere
        run: |
          page=$(sed -n 's/.*<meta name="sunkan-build" content="\([^"]*\)".*/\1/p' index.html)
          app=$(sed -n "s/.*var APP_VERSION = '\([^']*\)'.*/\1/p" assets/app.js)
          json=$(sed -n 's/.*"build"[^"]*"\([^"]*\)".*/\1/p' version.json)
          echo "index.html   : $page"
          echo "assets/app.js: $app"
          echo "version.json : $json"
          if [ -z "$page" ] || [ -z "$app" ] || [ -z "$json" ]; then
            echo "::error::版の文字列を読み取れませんでした"
            exit 1
          fi
          if [ "$page" != "$app" ] || [ "$app" != "$json" ]; then
            echo "::error::版が食い違っています。3 か所を同じ文字列にしてください（README の「版を上げる」）。"
            echo "::error::このまま公開すると「画面の一部が古いままです」の帯が、更新しても消えなくなります。"
            exit 1
          fi

          # index.html が読む一式は、版で縛る（assets/app.js?v=47 のように）。
          # 縛っておかないと、新しいページに古い js / css が当たったままになり、
          # 画面の一部だけが古いという状態が端末に居座る。
          num=$(printf '%s' "$app" | sed -n 's/^build \([0-9][0-9]*\).*/\1/p')
          if [ -z "$num" ]; then
            echo "::error::版の番号を読み取れませんでした（$app）"
            exit 1
          fi
          # 画像（アイコン）は版で縛らない。中身が変わっても画面の作りとはずれない。
          # ずれて困るのは、ページと一緒に動く js / css だけ。
          bad=$(grep -oE '(src|href)="assets/[^"]+\.(js|css)"' index.html || true)
          if [ -n "$bad" ]; then
            echo "::error::版を付けていない読み込みがあります（?v=$num を付けてください）:"
            echo "$bad"
            exit 1
          fi
          wrong=$(grep -oE '(src|href)="assets/[^"]+\.(js|css)\?v=[0-9]+"' index.html \
                  | grep -v "?v=$num\"" || true)
          if [ -n "$wrong" ]; then
            echo "::error::版の番号が本体（$num）と違う読み込みがあります:"
            echo "$wrong"
            exit 1
          fi
          echo "一式の版しばり: ?v=$num でそろっています"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
